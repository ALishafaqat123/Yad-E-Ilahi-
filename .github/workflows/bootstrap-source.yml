name: Bootstrap source tree

on:
  push:
    paths:
      - 'bootstrap/source.part_*'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop when bootstrap parts are already removed
        id: parts
        shell: bash
        run: |
          if compgen -G 'bootstrap/source.part_*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild source archive
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          cat $(find bootstrap -maxdepth 1 -type f -name 'source.part_*' | sort) | base64 -d > /tmp/yad-source.zip
          mkdir -p /tmp/yad-source
          unzip -q /tmp/yad-source.zip -d /tmp/yad-source
          rsync -a --exclude='.github/' --exclude='bootstrap/' /tmp/yad-source/ ./
          rm -f bootstrap/source.part_*

      - name: Commit extracted source
        if: steps.parts.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Yad-E-Ilahi v1.1.0 challenge source'
          git push
