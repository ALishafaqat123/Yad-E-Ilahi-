name: Bootstrap source tree

on:
  push:
    paths:
      - 'bootstrap/READY'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          test -f bootstrap/READY
          test -n "$(find bootstrap -maxdepth 1 -type f -name 'source.part_*' -print -quit)"
          cat $(find bootstrap -maxdepth 1 -type f -name 'source.part_*' | sort) | base64 -d > /tmp/yad-source.zip
          unzip -tq /tmp/yad-source.zip
          mkdir -p /tmp/yad-source
          unzip -q /tmp/yad-source.zip -d /tmp/yad-source
          rsync -a --exclude='.github/' --exclude='bootstrap/' /tmp/yad-source/ ./
          rm -rf bootstrap

      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add Yad-E-Ilahi v1.1.0 challenge source'
          git push
