name: Build Challenge APK

on:
  push:
    branches:
      - feature/challenges
    paths-ignore:
      - '**/*.md'
      - 'builds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add temporary compile font
        shell: bash
        run: |
          mkdir -p app/src/main/res/font
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf' \
            -o app/src/main/res/font/jameel_noori_nastaleeq_regular.ttf
          test -s app/src/main/res/font/jameel_noori_nastaleeq_regular.ttf

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Save unsigned APK to branch
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p builds
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            builds/Yad-Elahi-v1.1.0-Challenges-Unsigned.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f builds/Yad-Elahi-v1.1.0-Challenges-Unsigned.apk
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build Yad-E-Ilahi v1.1.0 challenge APK'
          git push
