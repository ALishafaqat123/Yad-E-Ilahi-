plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rizwan.tasbeehcounter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rizwan.yadelahi'
        minSdk 27
        targetSdk 34
        versionCode 20
        versionName '1.1.0-challenges'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
